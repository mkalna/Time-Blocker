<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Blocker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#f4f3ef;--surface:#fff;--text:#1c1917;--text2:#78716c;--text3:#a8a29e;
    --border:#e7e5e4;--border2:#d6d3d1;
    --school:#6366f1;--school-light:#e0e1fc;
    --work:#e5930a;--work-light:#fef3c7;
    --workout:#0d9669;--workout-light:#d1fae5;
    --personal:#db2777;--personal-light:#fce7f3;
    --accent:#6366f1;--accent-light:#eef0ff;
    --danger:#dc2626;--success:#10b981;--radius:10px;
  }
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:14px 12px;}
  .wrap{max-width:1280px;margin:0 auto;}
  .header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
  .header h1{font-size:21px;font-weight:700;letter-spacing:-0.6px;}
  .header .sub{font-size:11px;color:var(--text3);margin-top:1px;}
  .cats{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
  .cat-badge{font-size:9px;font-weight:700;padding:2px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;}
  .toolbar{display:flex;align-items:center;gap:5px;margin:8px 0 10px;flex-wrap:wrap;}
  .btn{padding:5px 11px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font:600 11px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;}
  .btn:hover{background:var(--bg);}
  .btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
  .spacer{flex:1;}
  .divider{width:1px;height:20px;background:var(--border2);margin:0 2px;}

  /* Layout */
  .main-layout{display:flex;gap:12px;align-items:flex-start;}
  .cal-panel{flex:1;min-width:0;overflow-x:auto;}
  .todo-panel{width:280px;flex-shrink:0;background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--border);overflow:hidden;position:sticky;top:14px;max-height:calc(100vh - 100px);display:flex;flex-direction:column;}
  @media(max-width:860px){
    .main-layout{flex-direction:column;}
    .todo-panel{width:100%;max-height:400px;position:static;}
  }

  /* Calendar */
  .cal-grid{display:grid;grid-template-columns:42px repeat(7,1fr);min-width:560px;}
  .day-head{text-align:center;padding:5px 0 4px;font-size:10px;font-weight:700;color:var(--text2);border-bottom:2px solid var(--border);}
  .day-head.today{color:var(--accent);border-color:var(--accent);}
  .day-head .num{font-size:16px;font-weight:700;color:var(--text);margin-top:1px;}
  .day-head.today .num{color:var(--accent);}
  .hour-label{font-size:9px;color:var(--text3);text-align:right;padding-right:5px;padding-top:2px;height:40px;border-top:1px solid #eee;font-variant-numeric:tabular-nums;}
  .cell{height:40px;border-top:1px solid #eee;border-left:1px solid #eee;position:relative;cursor:pointer;transition:background .1s;}
  .cell:hover{background:#f0eeeb;}
  .cell.today-col{background:var(--accent-light);}
  .cell.today-col:hover{background:#ddd9ff;}
  .cell.drag-over{background:#c7d2fe !important;outline:2px dashed var(--accent);outline-offset:-2px;}
  .block{position:absolute;top:1px;left:2px;right:2px;border-radius:5px;color:#fff;font-size:9px;font-weight:600;padding:2px 5px;z-index:2;cursor:pointer;overflow:hidden;line-height:1.3;transition:transform .1s;}
  .block:hover{transform:scale(1.03);filter:brightness(1.08);}
  .block .bt{font-size:8px;opacity:.85;margin-top:1px;}

  /* Todo panel */
  .tp-header{padding:10px 12px 8px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .tp-header h2{font-size:14px;font-weight:700;}
  .tp-scope{display:flex;background:var(--border);border-radius:6px;padding:1.5px;}
  .tp-scope button{padding:4px 10px;border-radius:5px;border:none;background:transparent;font:700 10px 'DM Sans',sans-serif;color:var(--text2);cursor:pointer;}
  .tp-scope button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .tp-days{display:flex;gap:2px;padding:8px 10px 6px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .tp-day{flex:1;height:28px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font:700 10px 'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .tp-day.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tp-day.is-today{color:var(--accent);}
  .tp-day.active.is-today{color:#fff;}
  .tp-body{flex:1;overflow-y:auto;padding:8px 10px;}
  .tp-progress{margin-bottom:8px;}
  .tp-progress-info{display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-bottom:3px;}
  .tp-bar{height:4px;border-radius:2px;background:var(--border);overflow:hidden;}
  .tp-bar-fill{height:100%;border-radius:2px;transition:width .3s;}

  .carry-banner{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#fff8ed;border:1px solid #f5d68e;border-radius:7px;margin-bottom:8px;font-size:10px;color:#92600a;font-weight:500;}
  .carry-banner button{padding:4px 10px;border-radius:6px;border:none;background:#e5930a;color:#fff;font:700 10px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;}

  .todo-item{display:flex;align-items:center;gap:6px;padding:7px 8px;background:var(--surface);border-radius:8px;border:1.5px solid var(--border);margin-bottom:5px;cursor:grab;transition:opacity .2s,box-shadow .15s;}
  .todo-item:active{cursor:grabbing;}
  .todo-item.dragging{opacity:.4;box-shadow:0 4px 16px rgba(0,0,0,.15);}
  .todo-item.done-item{opacity:.45;cursor:default;}
  .todo-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--border2);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0;}
  .todo-check.checked{background:var(--success);border-color:var(--success);}
  .todo-body{flex:1;min-width:0;}
  .todo-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .todo-title.struck{text-decoration:line-through;color:var(--text3);}
  .todo-meta{display:flex;gap:6px;margin-top:2px;font-size:9px;font-weight:600;}
  .todo-grip{color:var(--text3);font-size:12px;cursor:grab;padding:0 2px;user-select:none;}
  .todo-edit{width:20px;height:20px;border-radius:4px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;}
  .add-btn{width:100%;padding:8px;margin-top:4px;border-radius:8px;border:1.5px dashed var(--border2);background:transparent;color:var(--text2);font:700 11px 'DM Sans',sans-serif;cursor:pointer;}
  .add-btn:hover{border-color:var(--accent);color:var(--accent);}
  .empty{text-align:center;padding:24px 0;color:var(--text3);font-size:11px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal{background:var(--surface);border-radius:14px;padding:20px;width:92%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
  .modal h3{font-size:15px;font-weight:700;margin-bottom:12px;}
  .modal label{display:block;font-size:10px;font-weight:600;color:var(--text2);margin:4px 0 3px;}
  .modal input,.modal select{width:100%;padding:7px 9px;border-radius:7px;border:1.5px solid var(--border);font:400 12px 'DM Sans',sans-serif;outline:none;margin-bottom:5px;}
  .modal input:focus,.modal select:focus{border-color:var(--accent);}
  .cat-picker{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;}
  .cat-opt{flex:1;min-width:55px;padding:6px 0;border-radius:7px;border:2px solid var(--border);background:var(--surface);font:700 10px 'DM Sans',sans-serif;cursor:pointer;text-align:center;}
  .pri-picker{display:flex;gap:5px;margin-bottom:10px;}
  .pri-opt{flex:1;padding:7px 0;border-radius:7px;border:2px solid var(--border);background:var(--surface);font:700 11px 'DM Sans',sans-serif;cursor:pointer;text-align:center;color:var(--text2);}
  .pri-opt.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent);}
  .m-actions{display:flex;gap:6px;margin-top:14px;}
  .m-actions .del{padding:8px 12px;border-radius:7px;border:none;background:#fee2e2;color:var(--danger);font:700 11px 'DM Sans',sans-serif;cursor:pointer;}
  .m-actions .cancel{padding:8px 12px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font:600 11px 'DM Sans',sans-serif;cursor:pointer;}
  .m-actions .save{padding:8px 16px;border-radius:7px;border:none;background:var(--accent);color:#fff;font:700 11px 'DM Sans',sans-serif;cursor:pointer;}
  .m-actions .save:disabled{opacity:.35;cursor:default;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:8px 20px;border-radius:9px;font:600 11px 'DM Sans',sans-serif;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div><h1>Time Blocker</h1><div class="sub" id="monthLabel"></div></div>
    <div class="cats" id="catBadges"></div>
  </div>
  <div class="toolbar">
    <button class="btn" onclick="prevWeek()">←</button>
    <button class="btn" id="todayBtn" onclick="goToday()">Today</button>
    <button class="btn" onclick="nextWeek()">→</button>
    <div class="divider"></div>
    <button class="btn" onclick="applyTemplate()">📋 Template</button>
    <button class="btn" onclick="saveTemplate()">💾 Save</button>
    <div class="spacer"></div>
  </div>
  <div class="main-layout">
    <div class="cal-panel" id="calPanel"></div>
    <div class="todo-panel" id="todoPanel"></div>
  </div>
</div>

<div class="overlay hidden" id="blockModal" onclick="closeBlockModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="bmTitle2">Add Block</h3>
    <label>Title</label><input id="bmTitle" placeholder="Block title"/>
    <label>Category</label><div class="cat-picker" id="bmCats"></div>
    <div style="display:flex;gap:8px">
      <div style="flex:1"><label>Start</label><select id="bmStart"></select></div>
      <div style="flex:1"><label>End</label><select id="bmEnd"></select></div>
    </div>
    <label>Day</label><select id="bmDay"></select>
    <div class="m-actions">
      <button class="del hidden" id="bmDel" onclick="deleteBlock()">Delete</button>
      <div class="spacer"></div>
      <button class="cancel" onclick="closeBlockModal()">Cancel</button>
      <button class="save" onclick="saveBlock()">Save</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="todoModal" onclick="closeTodoModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="tmTitle2">Add To-Do</h3>
    <label>What needs doing?</label><input id="tmTitle" placeholder="e.g. Finish chapter 4 notes"/>
    <label>Category</label><div class="cat-picker" id="tmCats"></div>
    <label>Priority</label><div class="pri-picker" id="tmPri"></div>
    <div class="m-actions">
      <button class="del hidden" id="tmDel" onclick="deleteTodo()">Delete</button>
      <div class="spacer"></div>
      <button class="cancel" onclick="closeTodoModal()">Cancel</button>
      <button class="save" id="tmSave" onclick="saveTodo()">Save</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
const CATS={
  school:{label:"School",color:"#6366f1",light:"#e0e1fc"},
  work:{label:"Work",color:"#e5930a",light:"#fef3c7"},
  workout:{label:"Workout",color:"#0d9669",light:"#d1fae5"},
  personal:{label:"Personal",color:"#db2777",light:"#fce7f3"},
};
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const HOURS=Array.from({length:17},(_,i)=>i+6);
const PRI={high:{label:"High",icon:"🔴",s:0},medium:{label:"Med",icon:"🟡",s:1},low:{label:"Low",icon:"🟢",s:2}};

let S={blocks:{},todos:{}};
let weekStart=getMonday(new Date());
let todoScope="daily";
let selectedDay=(new Date().getDay()+6)%7;
let editBlockId=null, editTodoId=null, loaded=false;
let dragTodo=null;

function uid(){return Math.random().toString(36).slice(2,9);}
function fH(h){return h===0?"12a":h===12?"12p":h<12?h+"a":(h-12)+"p";}
function getMonday(d){const dt=new Date(d);dt.setDate(dt.getDate()-((dt.getDay()+6)%7));return dt.toISOString().split("T")[0];}
function getWeekDates(ws){const s=new Date(ws+"T00:00:00");return DAYS.map((_,i)=>{const d=new Date(s);d.setDate(d.getDate()+i);return d;});}
function wk(){return weekStart;}
function wb(){return S.blocks[wk()]||[];}
function wt(){return S.todos[wk()]||[];}
function swb(b){S.blocks[wk()]=b;save();}
function swt(t){S.todos[wk()]=t;save();}

async function load(){
  try{const r=await window.storage.get("tb-v4");if(r?.value)S=JSON.parse(r.value);}catch{}
  loaded=true;render();
}
async function save(){if(!loaded)return;try{await window.storage.set("tb-v4",JSON.stringify(S));}catch{} render();}
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),2200);}

function prevWeek(){const d=new Date(weekStart+"T00:00:00");d.setDate(d.getDate()-7);weekStart=d.toISOString().split("T")[0];render();}
function nextWeek(){const d=new Date(weekStart+"T00:00:00");d.setDate(d.getDate()+7);weekStart=d.toISOString().split("T")[0];render();}
function goToday(){weekStart=getMonday(new Date());selectedDay=(new Date().getDay()+6)%7;render();}

async function saveTemplate(){
  try{
    const cb=wb().map(({id,fromTemplate,...r})=>r);
    const ct=wt().map(({id,fromTemplate,done,...r})=>r);
    await window.storage.set("tb-tpl-v4",JSON.stringify({blocks:cb,todos:ct}));
    toast("Saved as template!");
  }catch{toast("Error saving");}
}
async function applyTemplate(){
  try{
    const r=await window.storage.get("tb-tpl-v4");
    if(r?.value){
      const t=JSON.parse(r.value);
      S.blocks[wk()]=[...wb().filter(b=>!b.fromTemplate),...(t.blocks||[]).map(b=>({...b,id:uid(),fromTemplate:true}))];
      S.todos[wk()]=[...wt().filter(x=>!x.fromTemplate),...(t.todos||[]).map(x=>({...x,id:uid(),fromTemplate:true,done:false}))];
      save();toast("Template applied!");
    }else toast("No template saved yet");
  }catch{toast("Error loading");}
}

function prevWk(){const d=new Date(weekStart+"T00:00:00");d.setDate(d.getDate()-7);return d.toISOString().split("T")[0];}
function unfinishedPrev(){return(S.todos[prevWk()]||[]).filter(t=>!t.done);}
function carryForward(){
  const uf=unfinishedPrev();if(!uf.length){toast("Nothing to carry");return;}
  const titles=new Set(wt().map(t=>t.title));
  const add=uf.filter(t=>!titles.has(t.title)).map(t=>({...t,id:uid(),done:false,carried:true}));
  if(!add.length){toast("Already carried over");return;}
  S.todos[wk()]=[...add,...wt()];save();toast(`Carried ${add.length} task${add.length>1?"s":""} forward!`);
}

function scopedTodos(){
  return todoScope==="weekly"?wt().filter(t=>t.dayIdx===-1||t.dayIdx===undefined):wt().filter(t=>t.dayIdx===selectedDay);
}

// Block modal
function openBlockModal(mode,dayIdx,hour,block){
  editBlockId=block?.id||null;
  document.getElementById("bmTitle2").textContent=mode==="add"?"Add Block":"Edit Block";
  document.getElementById("bmTitle").value=block?.title||"";
  document.getElementById("bmDel").classList.toggle("hidden",mode==="add");
  buildCatPicker("bmCats",block?.category||"school");
  const ss=document.getElementById("bmStart"),es=document.getElementById("bmEnd"),ds=document.getElementById("bmDay");
  ss.innerHTML=HOURS.map(h=>`<option value="${h}"${h===(block?.startHour??hour)?" selected":""}>${fH(h)}</option>`).join("");
  es.innerHTML=HOURS.filter(h=>h>(block?.startHour??hour)).map(h=>`<option value="${h}"${h===(block?.endHour??(hour+1))?" selected":""}>${fH(h)}</option>`).join("");
  ds.innerHTML=DAYS.map((d,i)=>`<option value="${i}"${i===(block?.dayIdx??dayIdx)?" selected":""}>${d}</option>`).join("");
  ss.onchange=()=>{const v=+ss.value;es.innerHTML=HOURS.filter(h=>h>v).map(h=>`<option value="${h}">${fH(h)}</option>`).join("");};
  document.getElementById("blockModal").classList.remove("hidden");
  document.getElementById("bmTitle").focus();
}
function closeBlockModal(){document.getElementById("blockModal").classList.add("hidden");}
function saveBlock(){
  const cat=document.querySelector("#bmCats .cat-opt.active")?.dataset.cat||"school";
  const d={dayIdx:+document.getElementById("bmDay").value,startHour:+document.getElementById("bmStart").value,endHour:+document.getElementById("bmEnd").value,category:cat,title:document.getElementById("bmTitle").value||CATS[cat].label};
  if(editBlockId)swb(wb().map(b=>b.id===editBlockId?{...b,...d}:b));
  else swb([...wb(),{...d,id:uid()}]);
  closeBlockModal();
}
function deleteBlock(){swb(wb().filter(b=>b.id!==editBlockId));closeBlockModal();}

// Todo modal
function openTodoModal(mode,todo){
  editTodoId=todo?.id||null;
  document.getElementById("tmTitle2").textContent=mode==="add"?"Add To-Do":"Edit To-Do";
  document.getElementById("tmTitle").value=todo?.title||"";
  document.getElementById("tmDel").classList.toggle("hidden",mode==="add");
  buildCatPicker("tmCats",todo?.category||"school");
  buildPriPicker(todo?.priority||"medium");
  document.getElementById("todoModal").classList.remove("hidden");
  document.getElementById("tmTitle").focus();
}
function closeTodoModal(){document.getElementById("todoModal").classList.add("hidden");}
function saveTodo(){
  const title=document.getElementById("tmTitle").value.trim();if(!title)return;
  const cat=document.querySelector("#tmCats .cat-opt.active")?.dataset.cat||"school";
  const pri=document.querySelector("#tmPri .pri-opt.active")?.dataset.pri||"medium";
  const d={title,category:cat,priority:pri,dayIdx:todoScope==="weekly"?-1:selectedDay};
  if(editTodoId)swt(wt().map(t=>t.id===editTodoId?{...t,...d}:t));
  else swt([...wt(),{...d,id:uid(),done:false}]);
  closeTodoModal();
}
function deleteTodo(){swt(wt().filter(t=>t.id!==editTodoId));closeTodoModal();}
function toggleTodo(id){swt(wt().map(t=>t.id===id?{...t,done:!t.done}:t));}

// Pickers
function buildCatPicker(cid,active){
  document.getElementById(cid).innerHTML=Object.entries(CATS).map(([k,v])=>{
    const a=k===active;
    return `<button class="cat-opt${a?" active":""}" data-cat="${k}" style="border-color:${a?v.color:"var(--border)"};background:${a?v.light:"var(--surface)"};color:${a?v.color:"var(--text2)"}" onclick="pickCat('${cid}','${k}')">${v.label}</button>`;
  }).join("");
}
function pickCat(cid,key){
  document.querySelectorAll(`#${cid} .cat-opt`).forEach(b=>{
    const k=b.dataset.cat,v=CATS[k],a=k===key;
    b.className="cat-opt"+(a?" active":"");
    b.style.borderColor=a?v.color:"var(--border)";
    b.style.background=a?v.light:"var(--surface)";
    b.style.color=a?v.color:"var(--text2)";
  });
}
function buildPriPicker(active){
  document.getElementById("tmPri").innerHTML=Object.entries(PRI).map(([k,v])=>
    `<button class="pri-opt${k===active?" active":""}" data-pri="${k}" onclick="pickPri('${k}')">${v.icon} ${v.label}</button>`).join("");
}
function pickPri(k){document.querySelectorAll("#tmPri .pri-opt").forEach(b=>b.classList.toggle("active",b.dataset.pri===k));}

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

// ---- DRAG AND DROP ----
function onDragStartTodo(e,todoId){
  dragTodo=wt().find(t=>t.id===todoId);
  e.dataTransfer.effectAllowed="copy";
  e.dataTransfer.setData("text/plain",todoId);
  e.target.classList.add("dragging");
}
function onDragEndTodo(e){e.target.classList.remove("dragging");dragTodo=null;}
function onDragOverCell(e){e.preventDefault();e.dataTransfer.dropEffect="copy";e.currentTarget.classList.add("drag-over");}
function onDragLeaveCell(e){e.currentTarget.classList.remove("drag-over");}
function onDropCell(e,dayIdx,hour){
  e.preventDefault();e.currentTarget.classList.remove("drag-over");
  if(!dragTodo)return;
  const cat=dragTodo.category||"school";
  const newBlock={id:uid(),dayIdx,startHour:hour,endHour:hour+1,category:cat,title:dragTodo.title};
  // Open modal pre-filled so user can adjust duration
  editBlockId=null;
  document.getElementById("bmTitle2").textContent="Add Block";
  document.getElementById("bmTitle").value=dragTodo.title;
  document.getElementById("bmDel").classList.add("hidden");
  buildCatPicker("bmCats",cat);
  const ss=document.getElementById("bmStart"),es=document.getElementById("bmEnd"),ds=document.getElementById("bmDay");
  ss.innerHTML=HOURS.map(h=>`<option value="${h}"${h===hour?" selected":""}>${fH(h)}</option>`).join("");
  es.innerHTML=HOURS.filter(h=>h>hour).map(h=>`<option value="${h}"${h===hour+1?" selected":""}>${fH(h)}</option>`).join("");
  ds.innerHTML=DAYS.map((d,i)=>`<option value="${i}"${i===dayIdx?" selected":""}>${d}</option>`).join("");
  ss.onchange=()=>{const v=+ss.value;es.innerHTML=HOURS.filter(h=>h>v).map(h=>`<option value="${h}">${fH(h)}</option>`).join("");};
  document.getElementById("blockModal").classList.remove("hidden");
  dragTodo=null;
}

// ---- RENDER ----
function render(){
  const dates=getWeekDates(weekStart);
  const isThis=weekStart===getMonday(new Date());
  const tIdx=isThis?(new Date().getDay()+6)%7:-1;
  const f=dates[0],l=dates[6],o={month:"short",day:"numeric"};
  document.getElementById("monthLabel").textContent=f.getMonth()===l.getMonth()
    ?`${f.toLocaleDateString("en-US",{month:"long",day:"numeric"})} – ${l.getDate()}, ${l.getFullYear()}`
    :`${f.toLocaleDateString("en-US",o)} – ${l.toLocaleDateString("en-US",o)}, ${l.getFullYear()}`;
  document.getElementById("catBadges").innerHTML=Object.entries(CATS).map(([k,v])=>
    `<span class="cat-badge" style="background:${v.light};color:${v.color};border:1.5px solid ${v.color}30">${v.label}</span>`).join("");
  document.getElementById("todayBtn").className=isThis?"btn accent":"btn";

  renderCal(dates,tIdx);
  renderTodos(dates,tIdx);
}

function renderCal(dates,tIdx){
  const blocks=wb();
  let h=`<div class="cal-grid"><div></div>`;
  DAYS.forEach((d,i)=>h+=`<div class="day-head${tIdx===i?" today":""}">${d}<div class="num">${dates[i].getDate()}</div></div>`);
  HOURS.forEach(hr=>{
    h+=`<div class="hour-label">${fH(hr)}</div>`;
    DAYS.forEach((_,di)=>{
      const isT=tIdx===di;
      const starts=blocks.filter(b=>b.dayIdx===di&&b.startHour===hr);
      let inner="";
      starts.forEach(b=>{
        const c=CATS[b.category];const sp=b.endHour-b.startHour;
        inner+=`<div class="block" style="height:${sp*40-3}px;background:${c.color};box-shadow:0 1px 3px ${c.color}40" onclick="event.stopPropagation();openBlockModal('edit',${di},${hr},${JSON.stringify(b).replace(/"/g,'&quot;')})"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(b.title||c.label)}</div>${sp>1?`<div class="bt">${fH(b.startHour)}–${fH(b.endHour)}</div>`:""}</div>`;
      });
      h+=`<div class="cell${isT?" today-col":""}" onclick="openBlockModal('add',${di},${hr})" ondragover="onDragOverCell(event)" ondragleave="onDragLeaveCell(event)" ondrop="onDropCell(event,${di},${hr})">${inner}</div>`;
    });
  });
  h+=`</div>`;
  document.getElementById("calPanel").innerHTML=h;
}

function renderTodos(dates,tIdx){
  const scoped=scopedTodos();
  const undone=scoped.filter(t=>!t.done),done=scoped.filter(t=>t.done);
  const sorted=[...undone,...done];
  const total=scoped.length,comp=done.length;
  const uf=unfinishedPrev();

  let h=`<div class="tp-header"><h2>To-Dos</h2><div class="tp-scope">
    <button class="${todoScope==="daily"?"active":""}" onclick="todoScope='daily';render()">Daily</button>
    <button class="${todoScope==="weekly"?"active":""}" onclick="todoScope='weekly';render()">Weekly</button>
  </div></div>`;

  if(todoScope==="daily"){
    h+=`<div class="tp-days">`;
    DAYS.forEach((d,i)=>{
      const cls=["tp-day"];if(selectedDay===i)cls.push("active");if(tIdx===i)cls.push("is-today");
      h+=`<button class="${cls.join(" ")}" onclick="selectedDay=${i};render()">${d}</button>`;
    });
    h+=`</div>`;
  }

  h+=`<div class="tp-body">`;

  if(uf.length){
    h+=`<div class="carry-banner"><span style="flex:1">📦 <b>${uf.length}</b> unfinished from last week</span><button onclick="carryForward()">Carry Over</button></div>`;
  }

  if(total>0){
    const pct=total?((comp/total)*100):0;
    h+=`<div class="tp-progress"><div class="tp-progress-info"><span>${comp}/${total} done</span><span>${total-comp} left</span></div><div class="tp-bar"><div class="tp-bar-fill" style="width:${pct}%;background:${comp===total?"var(--success)":"var(--accent)"}"></div></div></div>`;
  }

  sorted.forEach(t=>{
    const c=CATS[t.category]||CATS.school;const p=PRI[t.priority]||PRI.medium;
    const draggable=!t.done;
    h+=`<div class="todo-item${t.done?" done-item":""}" ${draggable?`draggable="true" ondragstart="onDragStartTodo(event,'${t.id}')" ondragend="onDragEndTodo(event)"`:""}>
      <div class="todo-check${t.done?" checked":""}" onclick="toggleTodo('${t.id}')">${t.done?"✓":""}</div>
      <div class="todo-body">
        <div class="todo-title${t.done?" struck":""}">${t.carried?"↩ ":""}${esc(t.title)}</div>
        <div class="todo-meta"><span style="color:${c.color}">${c.label}</span><span>${p.icon} ${p.label}</span></div>
      </div>
      ${draggable?`<div class="todo-grip" title="Drag to calendar">⠿</div>`:""}
      <button class="todo-edit" onclick="openTodoModal('edit',${JSON.stringify(t).replace(/"/g,'&quot;')})">✎</button>
    </div>`;
  });

  h+=`<button class="add-btn" onclick="openTodoModal('add')">+ Add To-Do</button>`;
  if(!sorted.length)h+=`<div class="empty">No to-dos for ${todoScope==="weekly"?"this week":DAYS[selectedDay]}. Add one!</div>`;
  h+=`</div>`;

  document.getElementById("todoPanel").innerHTML=h;
}

load();
</script>
</body>
</html>
